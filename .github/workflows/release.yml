name: Release

# A tag is the only trigger for a real release: `git tag v1.2.3 && git push
# --tags` publishes to every channel. workflow_dispatch covers the other two
# cases: re-running a release whose publish step failed after the tag was
# already pushed, and `dry_run` — a full build of every platform with every
# publish step skipped, which is how the config gets validated without
# spending a tag or touching a channel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to re-release (e.g. v1.2.3). Ignored when dry_run is set.
        required: false
      dry_run:
        description: Build everything, publish nothing. Uploads dist/ as an artifact.
        type: boolean
        default: false

permissions:
  contents: write
  # npm publishes via trusted publishing (OIDC) rather than a token: the job
  # exchanges this short-lived identity token for publish rights that npm has
  # bound to this repo and this workflow file. Nothing to rotate, and nothing
  # worth stealing out of the repo's secrets.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Repeated at job level as well as workflow level: npm's OIDC exchange
    # needs the runner to be handed ACTIONS_ID_TOKEN_REQUEST_URL, and the
    # job-level grant is the form that reliably provisions it.
    permissions:
      contents: write
      id-token: write
    env:
      VERSION_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # A dry run builds from whatever it checked out, so it needs no tag and
      # must not reach any publish step.
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
    outputs:
      # Repeats the expression rather than reading env.VERSION_TAG: job-level
      # env is not in scope for job outputs, and it would resolve to empty.
      version_tag: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version and the changelog from the git
          # history, so a shallow clone gives it neither.
          fetch-depth: 0
          # A dry run has no tag to check out — it validates the branch it was
          # dispatched from.
          ref: ${{ github.event.inputs.dry_run == 'true' && github.ref || (github.event.inputs.tag || github.ref) }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Deliberately no registry-url: it writes an .npmrc pinning
          # _authToken=${NODE_AUTH_TOKEN}, and with trusted publishing there is
          # no such token. npm then authenticates with an empty string instead
          # of falling back to OIDC, and reports it as a 404 on PUT.

      # npm's trusted publishing reports a missing OIDC identity as a 404 or
      # ENEEDAUTH, which points at the wrong thing entirely. Checking for the
      # request URL up front turns that into an obvious diagnosis. The token
      # itself is never printed.
      - name: Check the OIDC identity is available
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: available — npm can use trusted publishing"
          else
            echo "OIDC: MISSING — id-token: write is not in effect;" \
                 "npm publish will fail with 404/ENEEDAUTH"
          fi

      # Nothing is published before the tests that gate it pass.
      - name: Test
        run: go test -race ./...

      # Publishing is all-or-nothing per channel, and a channel with no
      # credentials is skipped rather than failing the release. Saying so up
      # front means a half-published release is never a surprise.
      - name: Report configured channels
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          SCOOP_DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          {
            echo "### Release channels"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "> **Dry run** — everything below is built but nothing is published."
              echo ""
            fi
            echo "| channel | credential | status |"
            echo "| --- | --- | --- |"
            echo "| GitHub release (archives, deb/rpm/apk) | GITHUB_TOKEN | publishing |"
            # npm holds no credential at all — it authenticates with an OIDC
            # identity token minted per run, so there is nothing to check for.
            echo "| npm / bun | OIDC (trusted publishing) | publishing |"
            for pair in "Homebrew cask:TAP_DEPLOY_KEY" "AUR:AUR_KEY" \
              "Scoop:SCOOP_DEPLOY_KEY" "winget:WINGET_TOKEN" "Chocolatey:CHOCO_API_KEY"; do
              name="${pair%%:*}"; var="${pair##*:}"
              if [ -n "${!var}" ]; then
                echo "| $name | $var | publishing |"
              else
                echo "| $name | $var | **skipped — secret not set** |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Cheap and catches schema errors before any binary is built.
      - name: Validate the config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          # --snapshot builds without a tag and publishes nothing; the explicit
          # --skip=publish means removing --snapshot later still cannot push.
          args: ${{ github.event.inputs.dry_run == 'true' && 'release --snapshot --clean --skip=publish' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every channel credential is withheld on a dry run. Belt and braces
          # with --snapshot: each block's skip_upload keys off isEnvSet, so an
          # absent variable makes the push a no-op on its own terms.
          #
          # Private half of the write-enabled deploy key on
          # Janne6565/homebrew-tap; GITHUB_TOKEN cannot reach another
          # repository, and a deploy key beats a PAT here because it is scoped
          # to that one repo and does not expire.
          TAP_DEPLOY_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.TAP_DEPLOY_KEY || '' }}
          # The private half of the SSH key registered with the AUR account.
          AUR_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.AUR_KEY || '' }}
          # Same deploy-key arrangement as the tap, for Janne6565/scoop-bucket.
          SCOOP_DEPLOY_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.SCOOP_DEPLOY_KEY || '' }}
          # winget is the exception: GoReleaser opens a pull request against
          # microsoft/winget-pkgs, and only an API token can do that.
          WINGET_TOKEN: ${{ github.event.inputs.dry_run != 'true' && secrets.WINGET_TOKEN || '' }}

      # The point of a dry run: inspect what would have shipped.
      - name: Upload dist/
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: dist-dry-run
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
            dist/artifacts.json
          retention-days: 7

      # Runs after GoReleaser because it reads the binaries out of dist/.
      - name: Publish to npm
        id: npm
        # !cancelled() rather than the default success(): npm reads binaries out
        # of dist/, which GoReleaser has already written by the time it pushes
        # to any channel. An outage at one of those channels — AUR went down
        # mid-release once — must not skip a publish that has everything it
        # needs.
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        # A failing npm publish must not take Chocolatey and the APT rebuild
        # with it — both are gated on this job's result, and they have nothing
        # to do with npm. The outcome is reported in the summary below instead.
        continue-on-error: true
        run: |
          # Node 22 ships npm 10.x; trusted publishing needs 11.5.1 or newer,
          # and without it npm falls back to looking for a token and fails with
          # an unhelpful 404/ENEEDAUTH rather than naming the real problem.
          npm install -g npm@latest
          npm --version

          # A prerelease tag (v1.2.3-rc.1) must not become `latest`, or
          # `bun i -g wharf-tui` would hand every user the release candidate.
          case "$VERSION_TAG" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          node scripts/npm-publish.mjs --version "$VERSION_TAG" --tag "$dist_tag"

      # continue-on-error above keeps the job green so Chocolatey and the APT
      # rebuild still run — which would otherwise let a failed publish pass
      # unnoticed. This makes it loud in the run summary instead.
      - name: Report the npm outcome
        if: always() && env.DRY_RUN != 'true'
        run: |
          case "${{ steps.npm.outcome }}" in
            success) echo "npm: published." >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "npm: skipped." >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
                     echo "> **npm publish FAILED** — the rest of the release went out." \
                       >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  # Chocolatey is the one channel GoReleaser cannot drive: `choco pack` needs
  # the choco binary, which only exists on a Windows runner. It waits for the
  # release job because it installs the binary out of the finished release.
  chocolatey:
    name: Chocolatey
    needs: release
    runs-on: windows-latest
    # Not gated on the release job succeeding: this installs the binary out of
    # the finished GitHub release, which exists as soon as GoReleaser has
    # uploaded it — well before the channel pushes that might fail afterwards.
    # The download step fails loudly if the release really is absent.
    if: ${{ !cancelled() && needs.release.result != 'skipped' && github.event.inputs.dry_run != 'true' }}
    env:
      VERSION_TAG: ${{ needs.release.outputs.version_tag }}
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip without an API key
        id: guard
        shell: bash
        run: |
          if [ -z "$CHOCO_API_KEY" ]; then
            echo "CHOCO_API_KEY is not set — skipping Chocolatey." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the package
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"   # nuspec versions carry no leading v
          cd packaging/chocolatey

          # Take the exact archive the release published, so the package and
          # the release are the same bytes — which is what VERIFICATION.txt
          # tells moderators and users to check.
          gh release download "$VERSION_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "wharf_${version}_windows_amd64.zip" \
            --output wharf.zip --clobber
          unzip -o -j wharf.zip wharf.exe -d tools/
          cp ../../LICENSE tools/LICENSE.txt

          # The nuspec is committed with a 0.0.0 placeholder so it stays
          # readable and reviewable in the repo.
          sed -i "s|<version>0.0.0</version>|<version>${version}</version>|" wharf.nuspec
          rm wharf.zip

      - name: Pack and push
        if: steps.guard.outputs.skip == 'false'
        shell: pwsh
        working-directory: packaging/chocolatey
        run: |
          choco pack wharf.nuspec --out .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem -Filter *.nupkg | Select-Object -First 1
          # The first version of a package goes through human moderation, so a
          # successful push means "submitted", not "live".
          choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Pushed $($pkg.Name) to Chocolatey (first release of a package waits on moderation)." `
            >> $env:GITHUB_STEP_SUMMARY
